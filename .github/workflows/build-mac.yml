name: Build the Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mido numpy pytest
      - run: python -m pytest -q

  build:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-14   # Apple silicon (M1 and later)
          - runner: macos-15-intel   # Intel Macs
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the app and disk image
        run: packaging/build_mac.sh
      - name: Check the app starts
        run: |
          "build/dist/Lumiere Link.app/Contents/MacOS/Lumiere Link" --help
      - uses: actions/upload-artifact@v4
        with:
          name: Lumiere-Link-${{ matrix.runner }}
          path: build/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dmg
          merge-multiple: true
      - name: Publish to the "Latest app" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view app-latest >/dev/null 2>&1 || \
            gh release create app-latest --title "Lumière Link (latest build)" --target "$GITHUB_SHA" \
              --notes "Download the .dmg for your Mac: arm64 = Apple silicon (M1 and later), x86_64 = Intel. Open it, drag Lumière Link into Applications, then open it. See README.md, part 3."
          gh release upload app-latest dmg/*.dmg --clobber
