name: Build the Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mido numpy pytest
      - run: python -m pytest -q

  build:
    needs: test
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    strategy:
      matrix:
        include:
          - runner: macos-14   # Apple silicon (M1 and later)
          - runner: macos-15-intel   # Intel Macs
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Load the Developer ID certificate (only if it has been added)
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/signing.keychain-db; KP=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import $RUNNER_TEMP/cert.p12 -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC"
          security list-keychains -d user -s "$KC"
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "DEVELOPER_ID=$ID" >> "$GITHUB_ENV"
      - name: Build the app and disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/build_mac.sh
      - name: Check the app starts
        run: |
          "build/dist/Lumiere Link.app/Contents/MacOS/Lumiere Link" --help
          "build/dist/Lumiere Link.app/Contents/MacOS/Lumiere Link" --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: Lumiere-Link-${{ matrix.runner }}
          path: build/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dmg
          merge-multiple: true
      - name: Publish to the "Latest app" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view app-latest >/dev/null 2>&1 || \
            gh release create app-latest --title "Lumière Link (latest build)" --target "$GITHUB_SHA" \
              --notes "Download the .dmg for your Mac: Apple-Silicon for M1/M2/M3/M4 Macs, Intel for older Macs. Open it, drag Lumière Link into Applications, then open it from Applications. See README.md, part 3."
          # Remove last build's files so only the current pair is offered.
          for a in $(gh release view app-latest --json assets -q '.assets[].name'); do
            gh release delete-asset app-latest "$a" -y
          done
          gh release upload app-latest dmg/*.dmg --clobber
