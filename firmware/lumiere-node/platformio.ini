; Lumière Node firmware for the WT32-ETH01.
;
; First time (USB-to-serial adapter, see README.md):
;   pio run -e usb -t upload
; After that, over the network:
;   pio run -e network -t upload

[env]
platform = espressif32@6.9.0
board = wt32-eth01
framework = arduino
monitor_speed = 115200
build_flags = -DNODE_VERSION=\"1.0.2\"

[env:usb]
upload_speed = 460800

[env:network]
upload_protocol = espota
upload_port = lumiere-node.local
upload_flags = --auth=lumiere-node
